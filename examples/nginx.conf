# Inside the server { } block. nginx serves the static files and passes the
# rest of /hello/ and the old PHP URL to server.py.

location /hello/ {
    try_files $uri @pyweb;		# a static file there wins
}
location ^~ /old/index.php {		# also /old/index.php/more
    # keeps the old URL; PHP is not installed, so no .php file is ever run
    include /etc/nginx/pyweb_proxy.conf;
}

location @pyweb {
    include /etc/nginx/pyweb_proxy.conf;
}

